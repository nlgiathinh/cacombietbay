<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cá Cơm Biết Bay</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/logo.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#EAF8FF">
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <div class="ambient-background">
        <div class="bokeh"></div><div class="bokeh"></div>
    </div>

    <header class="ui-text">
        <div class="controls">
            <button onclick="changeTheme('light')" title="Ban ngày"><i class='bx bx-sun'></i></button>
            <button onclick="changeTheme('sepia')" title="Giấy cũ"><i class='bx bx-coffee'></i></button>
            <button onclick="changeTheme('dark')" title="Ban đêm"><i class='bx bx-moon'></i></button>
        </div>

<div class="logo" onclick="showHome()">
    <img src="title.png" alt="Tên trang" style="height: 48px; object-fit: contain;">
</div>
    <div class="controls">
        <button onclick="changeFontSize(1)" title="Phóng to">A+</button>
        <button onclick="changeFontSize(-1)" title="Thu nhỏ">A-</button>
        <button onclick="checkAdmin()" title="Đăng truyện" style="border-color: transparent;"><i class='bx bxs-lock-alt'></i></button>
    </div>
</header>

    <!-- MÀN HÌNH 1: TRANG CHỦ (LƯỚI TRUYỆN) -->
    <main id="view-home" class="container ui-text">
        <div class="book-grid" id="book-grid-container">
            <!-- Render từ JS -->
        </div>
    </main>

    <!-- MÀN HÌNH 2: CHI TIẾT TRUYỆN -->
    <main id="view-story" class="container hidden ui-text">
        <button class="btn-nav" onclick="showHome()" style="margin-bottom: 20px; background: transparent; color: var(--accent-color); border: 1px solid var(--accent-color);">
            <i class='bx bx-left-arrow-alt'></i> Quay lại
        </button>
        <div class="story-meta" id="story-meta-container">
            <!-- Render từ JS -->
        </div>
        <h3 style="margin-bottom: 15px;">Danh sách chương</h3>
        <div class="chapter-list" id="chapter-list-container">
            <!-- Render từ JS -->
        </div>
    </main>

    <!-- MÀN HÌNH 3: ĐỌC TRUYỆN -->
    <main id="view-reading" class="container hidden">
        <div class="ui-text" style="text-align: center; margin-bottom: 20px;">
            <button class="btn-nav" onclick="showStory(currentStoryId)" style="background: transparent; color: var(--accent-color); border: 1px solid var(--accent-color);">
                <i class='bx bx-menu'></i> Mục lục
            </button>
        </div>
        <h1 class="chapter-title" id="reading-title">Tiêu đề chương</h1>
        <div class="reading-content" id="reading-content">
            <!-- Nội dung truyện -->
        </div>
        <div class="chapter-nav ui-text">
            <button class="btn-nav" id="btn-prev" onclick="changeChapter(-1)"><i class='bx bx-chevron-left'></i> Chương trước</button>
            <button class="btn-nav" id="btn-next" onclick="changeChapter(1)">Chương sau <i class='bx bx-chevron-right'></i></button>
        </div>
    </main>

    <script src="frontend.js"></script>
</body>
</html>
